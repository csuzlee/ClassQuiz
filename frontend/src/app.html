<!doctype html>
<html lang="en">
	<head>
		<link id="custom-classquiz-css" rel="stylesheet" href="%sveltekit.assets%/custom.css" />
		<meta charset="utf-8" />
		<meta name="description" content="" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			window.plausible =
				window.plausible ||
				function () {
					(window.plausible.q = window.plausible.q || []).push(arguments);
				};
		</script>

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon-16x16.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="ClassQuiz" />
		<meta name="application-name" content="ClassQuiz" />
		<meta name="msapplication-TileColor" content="#00a300" />
		<meta name="theme-color" content="#f7f8fc" />
		<script>
			// Apply the theme before first paint (the layout repeats this after hydration).
			(function () {
				try {
					var dark =
						localStorage.theme === 'dark' ||
						(!('theme' in localStorage) &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					if (dark)
						document
							.querySelector('meta[name="theme-color"]')
							.setAttribute('content', '#0f1424');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div>%sveltekit.body%</div>
	</body>
</html>
